server:
  port: 9080
spring:
  application:
    name: event-service
  datasource:
    url: jdbc:postgresql://localhost:5432/ticket-master
    username: admin
    password: 1234

  jpa:
    hibernate:
      ddl-auto: validate
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true

  liquibase:
    change-log: classpath:/db/changelog/db.changelog-master.yaml

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    fetch-registry: true
    register-with-eureka: true

