spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: true
              lower-case-service-id: true

          routes:
            - id: search-service-route
              uri: lb://search-service
              predicates:
                  - Path=/search/**

            - id: event-service-route
              uri: lb://event-service
              predicates:
                - Path=/event/**

            - id: booking-service-route
              uri: lb://booking-service
              predicates:
                - Path=/bookings/**

eureka:
  client:
    register-with-eureka: false
    service-url:
      defaultZone: http://localhost:8761/eureka/
    fetch-registry: true

server:
  port: 8070