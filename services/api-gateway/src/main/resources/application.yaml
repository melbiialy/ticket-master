spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:4000/realms/master
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: false
              lower-case-service-id: true





eureka:
  client:
    register-with-eureka: false
    service-url:
      defaultZone: http://localhost:8761/eureka/
    fetch-registry: true

server:
  port: 8070

resilience4j:
  circuitbreaker:
    configs:
      default:
        registerHealthIndicator: true
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        minimumNumberOfCalls: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        eventConsumerBufferSize: 10
    instances:
      searchCB:
        baseConfig: default
      eventCB:
        baseConfig: default
      bookingCB:
        baseConfig: default
        # booking is more sensitive to load spikes -> trip a bit faster
        failureRateThreshold: 40

  bulkhead:
    configs:
      default:
        maxConcurrentCalls: 10
        maxWaitDuration: 100ms
    instances:
      searchCB:
        baseConfig: default
      eventCB:
        baseConfig: default
      bookingCB:
        baseConfig: default
        maxWaitDuration: 200ms

  timelimiter:
    configs:
      default:
        timeoutDuration: 3s
        cancelRunningFuture: true
    instances:
      searchCB:
        baseConfig: default
      eventCB:
        baseConfig: default
      bookingCB:
        baseConfig: default