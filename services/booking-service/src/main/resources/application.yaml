server:
  port: 9090

spring:
  application:
    name: booking-service

  datasource:
    url: jdbc:postgresql://localhost:5432/ticket-master
    username: admin
    password: 1234

  jpa:
    hibernate:
      ddl-auto: validate
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    fetch-registry: true
    register-with-eureka: true
